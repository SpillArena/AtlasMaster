name = "atlasmaster"
compatibility_date = "2026-08-05"
pages_build_output_dir = "./dist"

# Tavla ligger nå i `spillarena-hub`, databasen hele domenet deler, i tabellen
# `atlasmaster_leaderboard`. Den het `leaderboard_entries` da AtlasMaster hadde
# databasen `atlasmaster-leaderboard` for seg selv; navnet måtte endres fordi
# FleetBot har en tabell med nøyaktig samme navn og andre kolonner.
#
# SKJEMAET EIES IKKE HERFRA LENGER. Det er derfor ingen migrations_dir her:
# `d1_migrations` er én tabell per database med UNIQUE på navnet, og hvert av
# spillene hadde sin egen `0001_*.sql`. Alle migrasjonene for denne databasen
# ligger i SpillArena/migrations/. Skal tavla endre form, skjer det der.
#
# `database_id` er det som faktisk binder appen til dataene. Endrer du den, peker
# ledertavla på en annen (tom) database.
[[d1_databases]]
binding = "DB"
database_name = "spillarena-hub"
database_id = "01624d56-fcd9-495d-9dd7-59b59a85da81"

# AUTH_SECRET er ikke her med vilje.
#
# Kontoene ligger IKKE lenger her. De ble flyttet til forsiden, som er den ene
# tjenesten på domenet som utsteder innloggingstegn — se
# SpillArena/functions/api/auth/. Det AtlasMaster gjør med AUTH_SECRET er å
# VERIFISERE et tegn forsiden har signert (shared/verify-token.js), og til det
# må hemmeligheten være nøyaktig den samme strengen som på Pages-prosjektet
# `spillarena`. Er den ikke det, faller hver innsending på 401 med et tegn som
# ser helt riktig ut.
#
# En signeringsnøkkel i en fil som ligger i git er ikke en nøkkel. Den skal settes som en
# kryptert variabel på Pages-prosjektet:
#
#   npx wrangler pages secret put AUTH_SECRET
#
# Lokalt: legg AUTH_SECRET=... i .dev.vars, som .gitignore allerede holder utenfor.
#
# UTEN DEN kan ingen tegn signeres, og både /api/auth og innsending av poeng
# svarer 503. Det er med vilje: å falle tilbake på noe som ser ut til å virke
# ville gitt kontoer som ikke verner noe. Rundene blir fortsatt lagret lokalt,
# så spillet virker — den globale tavla tar bare ikke imot.
